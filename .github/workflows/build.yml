name: Build PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: assignment-template
          path: main.pdf

      - name: Attach PDF to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: main.pdf
